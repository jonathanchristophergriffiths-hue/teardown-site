<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="sphere" cx="32%" cy="30%" r="72%">
      <stop offset="0%"  stop-color="#F4E3C0"/>
      <stop offset="35%" stop-color="#E6CF9A"/>
      <stop offset="70%" stop-color="#B89365"/>
      <stop offset="100%" stop-color="#5F4020"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#8A6A3A"/>
      <stop offset="50%" stop-color="#5B3F1D"/>
      <stop offset="100%" stop-color="#2F1F0B"/>
    </linearGradient>
    <linearGradient id="ringShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#C9A770" stop-opacity="0.8"/>
      <stop offset="50%"  stop-color="#C9A770" stop-opacity="0"/>
      <stop offset="100%" stop-color="#C9A770" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="base" cx="50%" cy="30%" r="80%">
      <stop offset="0%"  stop-color="#6B4A20"/>
      <stop offset="100%" stop-color="#2A1808"/>
    </radialGradient>
  </defs>

  <!-- Vintage wood/brass base -->
  <ellipse cx="32" cy="60" rx="13" ry="2" fill="#1A0F06"/>
  <path d="M 19 58 L 45 58 L 42 55 L 22 55 Z" fill="url(#base)"/>
  <rect x="21" y="52" width="22" height="3" rx="0.5" fill="url(#base)"/>
  <rect x="24" y="49" width="16" height="3" rx="0.5" fill="url(#base)"/>
  <!-- Base rise to ring -->
  <rect x="28" y="44" width="8" height="5" fill="url(#base)"/>
  <rect x="30" y="40" width="4" height="4" fill="url(#base)"/>

  <!-- Meridian ring (full circle holder) -->
  <circle cx="32" cy="26" r="22" fill="none" stroke="url(#ring)" stroke-width="2.8"/>
  <!-- Tick marks on the ring (degree markings) -->
  <g stroke="#3A2512" stroke-width="0.4" opacity="0.7">
    <line x1="32" y1="4"  x2="32" y2="6"/>
    <line x1="32" y1="46" x2="32" y2="48"/>
    <line x1="10" y1="26" x2="12" y2="26"/>
    <line x1="52" y1="26" x2="54" y2="26"/>
    <line x1="16" y1="11" x2="18" y2="13"/>
    <line x1="48" y1="11" x2="46" y2="13"/>
    <line x1="16" y1="41" x2="18" y2="39"/>
    <line x1="48" y1="41" x2="46" y2="39"/>
  </g>
  <!-- Ring inner shine -->
  <circle cx="32" cy="26" r="22" fill="none" stroke="url(#ringShine)" stroke-width="0.7" opacity="0.6"/>

  <!-- Axis pivots (where the sphere meets the ring, top + bottom) -->
  <circle cx="32" cy="6"  r="1.6" fill="#3A2512"/>
  <circle cx="32" cy="46" r="1.6" fill="#3A2512"/>

  <!-- The sphere -->
  <circle cx="32" cy="26" r="19" fill="url(#sphere)"/>

  <!-- Continents — Europe, Africa, Asia edge visible (matches the reference) -->
  <!-- Europe -->
  <path d="M 28 16 Q 33 15 35 18 Q 34 21 30 21 Q 27 20 28 16 Z" fill="#6F4A20" opacity="0.85"/>
  <!-- Scandinavia / UK hint -->
  <path d="M 30 14 Q 32 13 33 15 Q 31 16 30 14 Z" fill="#6F4A20" opacity="0.75"/>
  <!-- Africa (main body) -->
  <path d="M 28 23 Q 33 22 35 27 Q 36 32 33 37 Q 30 40 28 36 Q 26 30 28 23 Z" fill="#6F4A20" opacity="0.85"/>
  <!-- Arabia / Middle East -->
  <path d="M 36 22 Q 40 21 41 24 Q 39 26 36 25 Z" fill="#6F4A20" opacity="0.8"/>
  <!-- Asia / India edge -->
  <path d="M 39 17 Q 45 17 46 22 Q 43 24 40 22 Q 38 19 39 17 Z" fill="#6F4A20" opacity="0.85"/>
  <!-- Southeast archipelago -->
  <path d="M 41 29 Q 44 29 44 31 Q 42 32 41 30 Z" fill="#6F4A20" opacity="0.6"/>

  <!-- Equator + latitude hints -->
  <ellipse cx="32" cy="27" rx="19" ry="1.5" fill="none" stroke="#6F4A20" stroke-width="0.4" opacity="0.25"/>
  <ellipse cx="32" cy="26" rx="7"  ry="19"  fill="none" stroke="#6F4A20" stroke-width="0.3" opacity="0.2"/>
  <path d="M 15 19 Q 32 17 49 19" fill="none" stroke="#6F4A20" stroke-width="0.3" opacity="0.2"/>
  <path d="M 15 33 Q 32 35 49 33" fill="none" stroke="#6F4A20" stroke-width="0.3" opacity="0.2"/>

  <!-- Glint highlight (glass-sphere cue) -->
  <ellipse cx="23" cy="18" rx="4" ry="2.3" fill="#F8EED4" opacity="0.55"/>
</svg>
